<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PodcastAI — Gerador de Roteiros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg2: #12121a;
    --bg3: #1a1a26;
    --accent: #7c5cfc;
    --accent2: #a78bfa;
    --accent-glow: rgba(124, 92, 252, 0.25);
    --text: #f0eff8;
    --muted: #8b8aa0;
    --border: rgba(255,255,255,0.07);
    --border-accent: rgba(124,92,252,0.4);
    --success: #34d399;
    --wave1: #7c5cfc;
    --wave2: #a78bfa;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .noise {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
  }

  .glow-orb {
    position: fixed; border-radius: 50%; pointer-events: none; filter: blur(80px);
  }
  .glow-orb.one {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,92,252,0.12), transparent 70%);
    top: -200px; right: -100px;
    animation: drift1 12s ease-in-out infinite alternate;
  }
  .glow-orb.two {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(52,211,153,0.06), transparent 70%);
    bottom: 0; left: -100px;
    animation: drift2 15s ease-in-out infinite alternate;
  }

  @keyframes drift1 { to { transform: translate(-60px, 80px); } }
  @keyframes drift2 { to { transform: translate(80px, -60px); } }

  .container {
    position: relative; z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 60px;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(124,92,252,0.12);
    border: 1px solid var(--border-accent);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 12px; font-weight: 500;
    color: var(--accent2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent2);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #ffffff 30%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 14px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.7;
    max-width: 460px;
    margin: 0 auto;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 20px;
  }

  .input-section { }

  .input-label {
    font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
    display: block;
  }

  .topic-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem; font-weight: 400;
    color: var(--text);
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.6;
  }
  .topic-input::placeholder { color: var(--muted); }
  .topic-input:focus { border-color: var(--border-accent); }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px 20px;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #9f7aea);
    color: #fff;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px var(--accent-glow); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--border-accent); background: rgba(124,92,252,0.08); }

  .btn:disabled {
    opacity: 0.5; cursor: not-allowed; transform: none !important;
    box-shadow: none !important;
  }

  .btn-icon { font-size: 1.1rem; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .output-section { display: none; }

  .output-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }

  .output-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem; font-weight: 700;
    letter-spacing: -0.01em;
  }

  .episode-tag {
    font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent2);
    background: rgba(124,92,252,0.12);
    border: 1px solid var(--border-accent);
    border-radius: 100px;
    padding: 4px 12px;
  }

  .script-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.4rem; font-weight: 700;
    margin-bottom: 16px;
    line-height: 1.3;
    letter-spacing: -0.02em;
  }

  .script-body {
    color: #c4c3d8;
    font-size: 0.95rem;
    line-height: 1.85;
    white-space: pre-wrap;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  .audio-section { display: none; }

  .audio-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
  }
  .audio-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #9f7aea);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }
  .audio-label { font-weight: 500; font-size: 0.95rem; }
  .audio-sub { font-size: 12px; color: var(--muted); }

  .waveform-bar {
    display: flex; align-items: center; gap: 3px;
    height: 48px;
    margin-bottom: 16px;
  }
  .waveform-bar span {
    display: block;
    width: 3px; border-radius: 2px;
    background: var(--accent);
    opacity: 0.4;
    animation: wave 1.2s ease-in-out infinite;
  }
  .waveform-bar.playing span { opacity: 1; }
  .waveform-bar span:nth-child(1) { height: 60%; animation-delay: 0s; }
  .waveform-bar span:nth-child(2) { height: 90%; animation-delay: 0.1s; }
  .waveform-bar span:nth-child(3) { height: 45%; animation-delay: 0.2s; }
  .waveform-bar span:nth-child(4) { height: 100%; animation-delay: 0.05s; }
  .waveform-bar span:nth-child(5) { height: 70%; animation-delay: 0.15s; }
  .waveform-bar span:nth-child(6) { height: 55%; animation-delay: 0.25s; }
  .waveform-bar span:nth-child(7) { height: 85%; animation-delay: 0.08s; }
  .waveform-bar span:nth-child(8) { height: 40%; animation-delay: 0.18s; }
  .waveform-bar span:nth-child(9) { height: 75%; animation-delay: 0.12s; }
  .waveform-bar span:nth-child(10) { height: 60%; animation-delay: 0.22s; }
  .waveform-bar span:nth-child(11) { height: 95%; animation-delay: 0.03s; }
  .waveform-bar span:nth-child(12) { height: 50%; animation-delay: 0.16s; }
  @keyframes wave {
    0%,100% { transform: scaleY(0.5); }
    50% { transform: scaleY(1); }
  }

  audio {
    width: 100%;
    outline: none;
  }
  audio::-webkit-media-controls-panel {
    background: var(--bg3);
  }

  .custom-player {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }

  .player-controls {
    display: flex; align-items: center; gap: 14px;
  }

  .play-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #9f7aea);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 1.1rem;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .play-btn:hover { transform: scale(1.08); box-shadow: 0 4px 16px var(--accent-glow); }

  .progress-wrap { flex: 1; }
  .progress-bar {
    width: 100%; height: 4px;
    background: var(--border);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.1s;
  }
  .time-row {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }

  .dl-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px;
    padding: 8px 16px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px; font-weight: 500;
    cursor: pointer; text-decoration: none;
    transition: color 0.2s, border-color 0.2s;
  }
  .dl-btn:hover { color: var(--text); border-color: var(--border-accent); }

  .status-msg {
    display: none;
    align-items: center; gap: 8px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.875rem;
    margin-top: 12px;
  }
  .status-msg.error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.2);
    color: #fca5a5;
  }
  .status-msg.loading {
    background: rgba(124,92,252,0.08);
    border: 1px solid var(--border-accent);
    color: var(--accent2);
  }

  @media (max-width: 540px) {
    .actions { grid-template-columns: 1fr; }
    h1 { font-size: 2rem; }
  }
</style>
</head>
<body>

<div class="noise"></div>
<div class="glow-orb one"></div>
<div class="glow-orb two"></div>

<div class="container">
  <header>
    <div class="badge">
      <span class="dot"></span>
      MediaCast
    </div>
    <h1>Podcast<br>Generator</h1>
    <p class="subtitle">Digite um tema e deixe a IA criar um roteiro profissional e narrar em áudio, pronto para gravar.</p>
  </header>

  <!-- Input Card -->
  <div class="card input-section">
    <label class="input-label" for="topic">Tema do episódio</label>
    <textarea
      id="topic"
      class="topic-input"
      rows="3"
      placeholder="Ex: O impacto da inteligência artificial no mercado de trabalho brasileiro..."
    ></textarea>

    <div class="actions">
      <button class="btn btn-primary" id="btn-script" onclick="generateScript()">
        <span class="spinner" id="spin-script"></span>
        <span class="btn-icon" id="icon-script">✦</span>
        <span id="label-script">Gerar roteiro</span>
      </button>
      <button class="btn btn-secondary" id="btn-audio" onclick="generateAudio()" disabled>
        <span class="spinner" id="spin-audio"></span>
        <span class="btn-icon" id="icon-audio">♪</span>
        <span id="label-audio">Gerar áudio do roteiro</span>
      </button>
    </div>

    <div class="status-msg" id="status-msg">
      <span id="status-text"></span>
    </div>
  </div>

  <!-- Script Output -->
  <div class="card output-section" id="output-section">
    <div class="output-header">
      <span class="output-title">Roteiro gerado</span>
      <span class="episode-tag">Episódio</span>
    </div>

    <div class="script-title" id="script-title"></div>
    <div class="script-body" id="script-body"></div>

    <div class="divider"></div>

    <!-- Audio Section -->
    <div class="audio-section" id="audio-section">
      <div class="audio-header">
        <div class="audio-icon">♪</div>
        <div>
          <div class="audio-label">Narração gerada</div>
          <div class="audio-sub">Texto para fala • Português BR</div>
        </div>
      </div>

      <div class="waveform-bar" id="waveform">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span>
      </div>

      <div class="custom-player">
        <audio id="audio-player" preload="auto"></audio>
        <div class="player-controls">
          <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
          <div class="progress-wrap">
            <div class="progress-bar" id="progress-bar" onclick="seekAudio(event)">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="time-row">
              <span id="time-cur">0:00</span>
              <span id="time-dur">0:00</span>
            </div>
          </div>
        </div>
      </div>

      <a class="dl-btn" id="dl-link" href="#" download>
        ↓ Baixar MP3
      </a>
    </div>
  </div>
</div>

<script>
  let currentScript = '';
  let audioPlayer = document.getElementById('audio-player');
  let isPlaying = false;

  function setLoading(btn, loading) {
    const spinEl = document.getElementById(`spin-${btn}`);
    const iconEl = document.getElementById(`icon-${btn}`);
    const labelEl = document.getElementById(`label-${btn}`);
    const btnEl = document.getElementById(`btn-${btn}`);
    spinEl.style.display = loading ? 'block' : 'none';
    iconEl.style.display = loading ? 'none' : 'inline';
    btnEl.disabled = loading;
    if (btn === 'script') labelEl.textContent = loading ? 'Gerando…' : 'Gerar roteiro';
    if (btn === 'audio') labelEl.textContent = loading ? 'Gerando…' : 'Gerar áudio do roteiro';
  }

  function showStatus(type, msg) {
    const el = document.getElementById('status-msg');
    const txt = document.getElementById('status-text');
    el.className = `status-msg ${type}`;
    el.style.display = 'flex';
    txt.textContent = msg;
  }
  function hideStatus() {
    document.getElementById('status-msg').style.display = 'none';
  }

  async function generateScript() {
    const topic = document.getElementById('topic').value.trim();
    if (!topic) { showStatus('error', 'Por favor, insira um tema para o episódio.'); return; }

    setLoading('script', true);
    hideStatus();
    showStatus('loading', 'A IA está criando seu roteiro…');

    try {
      const res = await fetch('/generate-script', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic })
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
      const data = await res.json();

      currentScript = data.script;
      document.getElementById('script-title').textContent = data.title;
      document.getElementById('script-body').textContent = data.script;

      document.getElementById('output-section').style.display = 'block';
      document.getElementById('audio-section').style.display = 'none';
      document.getElementById('btn-audio').disabled = false;
      document.getElementById('output-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
      hideStatus();
    } catch (err) {
      showStatus('error', 'Erro: ' + err.message);
    } finally {
      setLoading('script', false);
    }
  }

  async function generateAudio() {
    if (!currentScript) return;

    setLoading('audio', true);
    hideStatus();
    showStatus('loading', 'Convertendo roteiro em áudio…');

    try {
      const res = await fetch('/generate-audio', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic: currentScript })
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
      const data = await res.json();

      audioPlayer.src = data.audio_url;
      audioPlayer.load();

      document.getElementById('audio-section').style.display = 'block';
      const dlLink = document.getElementById('dl-link');
      dlLink.href = data.audio_url;
      dlLink.download = data.filename;

      audioPlayer.addEventListener('loadedmetadata', () => {
        document.getElementById('time-dur').textContent = formatTime(audioPlayer.duration);
      });
      audioPlayer.addEventListener('timeupdate', updateProgress);
      audioPlayer.addEventListener('ended', () => {
        isPlaying = false;
        document.getElementById('play-btn').textContent = '▶';
        document.getElementById('waveform').classList.remove('playing');
      });

      document.getElementById('audio-section').scrollIntoView({ behavior: 'smooth' });
      hideStatus();
    } catch (err) {
      showStatus('error', 'Erro: ' + err.message);
    } finally {
      setLoading('audio', false);
    }
  }

  function togglePlay() {
    if (!audioPlayer.src) return;
    if (isPlaying) {
      audioPlayer.pause();
      document.getElementById('play-btn').textContent = '▶';
      document.getElementById('waveform').classList.remove('playing');
    } else {
      audioPlayer.play();
      document.getElementById('play-btn').textContent = '⏸';
      document.getElementById('waveform').classList.add('playing');
    }
    isPlaying = !isPlaying;
  }

  function updateProgress() {
    const fill = document.getElementById('progress-fill');
    const cur = document.getElementById('time-cur');
    const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
    fill.style.width = pct + '%';
    cur.textContent = formatTime(audioPlayer.currentTime);
  }

  function seekAudio(e) {
    const bar = document.getElementById('progress-bar');
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audioPlayer.currentTime = pct * audioPlayer.duration;
  }

  function formatTime(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  document.getElementById('topic').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generateScript();
  });
</script>
</body>
</html>
